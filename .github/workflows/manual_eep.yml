# This is a basic workflow that is manually triggered

name: Manual eep creation

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      core:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'ESP core (esp8266 or esp32)'
        # Default value if no value is explicitly provided
        default: 'esp32'
        # Input has to be provided for the workflow to run
        required: true
      board:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'ESP board type ()'
        # Default value if no value is explicitly provided
        default: 'lolin32-lite'
        # Input has to be provided for the workflow to run
        required: true
      target_OS:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Target OS (win64, linux_x64, linux_arm64, linux_armv7, macos_intel, macos_arm64)'
        # Default value if no value is explicitly provided
        default: 'win64'
        # Input has to be provided for the workflow to run
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  build_eep:
    uses: ./.github/workflows/build_eep.yml
    with:
      core: ${{ github.event.inputs.core }}
      board: ${{ github.event.inputs.board }}
  build_EEF_packages:
    runs-on: ubuntu-latest
    needs: [build_eep]
    steps:
      - uses: hredan/eef-carefree-action@init
        with:
          target-os: ${{ github.event.inputs.target_OS }}
