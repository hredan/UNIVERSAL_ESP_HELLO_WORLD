name: main_action
on: [push, pull_request]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build_eep_esp8266:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp8266
      board: d1_mini
  build_eep_esp32:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32
  build_eep_esp32c3:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c3
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32c5:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c5
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32c6:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c6
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32h2:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32h2
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32p4:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32p4
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32s2:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32s2
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32s3:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32s3
      fqbn-ext: "CDCOnBoot=cdc"
  build_EEF_packages:
    runs-on: ubuntu-latest
    needs: [build_eep_esp32s3, build_eep_esp32s2, build_eep_esp32p4, build_eep_esp32h2, build_eep_esp32c6, build_eep_esp32c5, build_eep_esp32c3, build_eep_esp32, build_eep_esp8266]
    env:
        TARGET: all
    steps:
      - uses: hredan/eef-carefree-action@init
        with:
          target-os: ${{env.TARGET}}
