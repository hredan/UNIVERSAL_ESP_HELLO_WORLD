on:
    workflow_call:
      inputs:
        core:
          description: 'ESP core (esp8266 or esp32)'
          default: 'esp32'
          required: true
          type: string
        board:
          description: 'ESP board'
          default: 'd1_mini32'
          type: string
          required: true
        core-version:
          description: 'ESP core version'
          default: ''
          type: string
          required: false
jobs:
    build_eep:
        runs-on: ubuntu-latest
        env:
            SKETCH_NAME: UNIVERSAL_ESP_HELLO_WORLD
        steps:
          - uses: actions/checkout@v6
          - uses: hredan/eep-build-action@main
            with:
              sketch-name: ${{env.SKETCH_NAME}}
              core: ${{ inputs.core }}
              board: ${{ inputs.board}}
              core-version: ${{ inputs.core-version }}
              libs: "Dictionary"